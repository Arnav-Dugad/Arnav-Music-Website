<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arnav Music</title>
    <meta name="description" content="Arnav Music for the web — music, alive. YouTube discovery, Apple-style lyrics, Arnav AI sessions, Moments and Taste DNA, synced with the Android app." />
    <meta name="theme-color" content="#060609" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Arnav Music" />
    <meta property="og:description" content="Music, alive. Lyrics, AI sessions, Moments and Taste DNA in your browser." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&family=Manrope:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { background: #060609; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #060609; z-index: 999; transition: opacity .6s cubic-bezier(.32,.72,0,1), transform .6s cubic-bezier(.32,.72,0,1); }
      #boot.done { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #boot svg { width: 72px; height: 72px; animation: bootPulse 1.6s ease-in-out infinite; }
      @keyframes bootPulse { 50% { transform: scale(.92); opacity: .7; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 108 108"><defs><linearGradient id="b1" x1="33" y1="73" x2="75" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#52D6C3"/><stop offset="1" stop-color="#B9AEFF"/></linearGradient></defs><path d="M33,73 C39,62 44.5,38 54,38.5 C63.5,39 69,62 75,73" stroke="url(#b1)" stroke-width="5.2" stroke-linecap="round" fill="none"/><path d="M42.5,62 C46,57.5 48.5,66.5 54,62 C59.5,57.5 62,66.5 65.5,62" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/></svg>
    </div>
    <div id="root"></div>
    <noscript>Arnav Music needs JavaScript to play music.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
